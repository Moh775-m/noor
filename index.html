  <body>
    <div id="root">
      <!-- Splash فوري يظهر أول شيء قبل تحميل React -->
      <div style="position:fixed;inset:0;z-index:9999;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 15%, #1e8a6a 0%, #0f5a43 45%, #062a22 100%);">

        <div style="position:relative;display:flex;flex-direction:column;align-items:center;">

          </div>

    <script type="module" src="/src/main.jsx"></script>

    <script>
      // تم تحديثه للتوكن الآمن بدل الإيميل المباشر
      window.sendRatingToEmail = async function(stars, text) {
        try {
          const res = await fetch("https://formsubmit.co/ajax/c52d05d5280889a1b3c7e732f9b2f8a9", {
            method: "POST",
            headers: { "Content-Type": "application/json", "Accept": "application/json" },
            body: JSON.stringify({
              _subject: "⭐ تقييم جديد " + stars + "/5 - نور المسلم",
              "التقييم": stars + " / 5",
              "الملاحظة": text || "بدون ملاحظة",
              "التاريخ": new Date().toLocaleString('ar-YE')
            })
          });
          return res.ok;
        } catch(e){ return false; }
      }
    </script>
  </body>
