<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0f5a43" />
    <title>نور المسلم</title>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700;900&display=swap" rel="stylesheet">
    <style>
      *{margin:0;padding:0;box-sizing:border-box}
      #initial-splash{
        position:fixed; inset:0;
        background:radial-gradient(circle at 50% 15%, #1e8a6a 0%, #0f5a43 45%, #062a22 100%);
        display:flex; flex-direction:column; align-items:center; justify-content:center;
        z-index:99999;
        font-family:'Amiri',serif;
      }
      #initial-splash.circle{
        width:140px; height:140px; border-radius:50%;
        background:#082e26; border:1px solid rgba(212,175,55,0.3);
        display:flex; align-items:center; justify-content:center;
        color:#fde68a; font-size:52px; font-weight:900;
        box-shadow:0 20px 40px rgba(0,0,0,0.3);
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-splash">
        <div class="circle">نور</div>
        <h1 style="margin-top:32px; color:white; font-size:26px; font-weight:900;">نور المسلم</h1>
        <p style="margin-top:8px; color:rgba(212,175,55,0.8); font-size:11px; letter-spacing:0.3em;">NOUR AL-MUSLIM</p>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
